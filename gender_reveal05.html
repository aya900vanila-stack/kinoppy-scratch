<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Christmas Gender Reveal Scratch Card</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8d6c4}body{display:grid;place-items:center;font-family:Georgia,serif}.card{position:relative;width:min(100vw,calc(100dvh * 928 / 1649));aspect-ratio:928/1649;background:url('background.png') center/100% 100% no-repeat;overflow:hidden;user-select:none;-webkit-user-select:none}.scratch{position:absolute;left:11%;top:35%;width:78%;height:35%;touch-action:none;cursor:crosshair}.scratch canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;bottom:1.5%;left:0;right:0;text-align:center;color:#85512f;font:clamp(9px,1.8vw,14px) Georgia,serif;letter-spacing:.1em;text-shadow:0 1px 3px #fff8;pointer-events:none}.reset{position:fixed;right:12px;bottom:12px;border:0;border-radius:999px;background:#fff9;color:#71452c;padding:10px 14px;font-size:13px;cursor:pointer;box-shadow:0 2px 10px #0002}
</style></head><body><main class="card" aria-label="Christmas gender reveal scratch card"><div class="scratch" id="scratch"><canvas id="foil" aria-label="Scratch the gold surface to reveal the message"></canvas></div></main><button class="reset" id="reset">↻ Reset</button><script>
const canvas=document.getElementById('foil'),area=document.getElementById('scratch'),ctx=canvas.getContext('2d');let drawing=false,last=null;
function setup(){const r=area.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);
// Large circular metallic gold scratch foil.
const cx=r.width/2,cy=r.height/2,radius=Math.min(r.width,r.height)*.485;
function circlePath(){ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.closePath();}
ctx.save();circlePath();ctx.clip();
const g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#9b6a20');g.addColorStop(.25,'#d9b45b');g.addColorStop(.5,'#f1d98a');g.addColorStop(.75,'#bd8b32');g.addColorStop(1,'#e6c66d');ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
for(let i=0;i<Math.floor(r.width*r.height/22);i++){const x=Math.random()*r.width,y=Math.random()*r.height;ctx.fillStyle=Math.random()>.5?'rgba(255,248,211,.28)':'rgba(91,57,10,.14)';const z=Math.random()*1.25+.25;ctx.fillRect(x,y,z,z);}
ctx.restore();ctx.save();circlePath();ctx.strokeStyle='rgba(255,242,190,.78)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function erase(p,q){const r=canvas.getBoundingClientRect();ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(22,r.width*.11);ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore()}
canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);last=pos(e);erase(last,last)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);erase(p,last);last=p});function stop(){drawing=false;last=null}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);document.getElementById('reset').onclick=setup;window.addEventListener('resize',setup);setup();
</script></body></html>
